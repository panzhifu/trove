[package]
name = "trove-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Command-line access to a Trove library, for scripts and agents."

# Forward the local-AI GPU backends (see trove-app's [features]).
[features]
cuda = ["trove-core/cuda"]
accelerate = ["trove-core/accelerate"]
metal = ["trove-core/metal"]

[[bin]]
name = "trove"
path = "src/main.rs"

[dependencies]
trove-core = { path = "../trove-core" }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
