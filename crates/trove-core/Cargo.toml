[package]
name = "trove-core"
version.workspace = true
edition.workspace = true
license.workspace = true

# GPU backends for the local AI engines. The default build is CPU-only and
# compiles on every platform with no CUDA toolkit; candle picks its device at
# runtime (a build without `cuda` answers `Device::new_cuda` with an error
# and the caller falls back to CPU). The release workflow enables `cuda` on
# the Linux/Windows legs and `accelerate` on macOS — see
# .github/workflows/release.yml.
[features]
# NVIDIA GPU backend: costs the CUDA toolkit at *build* time (nvcc compiles
# the bundled kernels) and the driver at *run* time; machines without either
# still run the CPU fallback. Enabled by the release workflow on the
# Linux/Windows legs and locally via `cargo build-cuda`.
cuda = ["candle-core/cuda", "candle-nn/cuda", "candle-transformers/cuda"]
# Apple's CPU acceleration framework — macOS only (the helper crate links a
# system framework), nothing to download or install.
accelerate = ["candle-core/accelerate"]
# Experimental Apple GPU backend. Not enabled by the release; flip it on to
# try the M-series GPU.
metal = ["candle-core/metal"]

[dependencies]
chrono = { workspace = true }
dirs = { workspace = true }
image = { workspace = true }
kamadak-exif = "0.5"
lofty = "0.21"
mp4 = { workspace = true }
# Text viewer: legacy-encoding detection and decoding. See the note in the
# workspace manifest for why these two and not a hand-rolled guess.
chardetng = { workspace = true }
encoding_rs = { workspace = true }
ttf-parser = { workspace = true }
fontdue = { workspace = true }
rusqlite = { workspace = true }
# In-process screen capture for the screenshot import (Linux: wlr-screencopy
# via libwayshot on Wayland and XCB on X11; macOS ScreenCaptureKit; Windows
# Graphics Capture). Compositors without wlr-screencopy (KWin) have no
# in-process path and fall through to the external toolchain in
# services/screenshot.rs, so a failed capture degrades instead of failing.
xcap = "0.9.8"
serde = { workspace = true }
serde_json = { workspace = true }
blake3 = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }
rayon = { workspace = true }
# Writes the full-backup archive (deflate, streaming, zip64). Deflate and
# CRC-32 already ride in the graph via lofty, so the added crates are the
# container logic and little else.
zip = { version = "2", default-features = false, features = ["deflate"] }
memchr = "2"
memmap2 = "0.9"  # memory-mapped file access for large PLY files
ureq = { workspace = true }
base64 = { workspace = true }
# The local recogniser's hallucination gate gzips its own output and reads
# the ratio (see ai/transcribe_local.rs). Already in the graph via zip, so
# this adds no compiled crates.
flate2 = "1"
notify = { workspace = true }
ignore = { workspace = true }
resvg = { workspace = true }
psd = { workspace = true }
rawler = { workspace = true }
jxl-oxide = { workspace = true }
# allow_empty_texture: `Texture::source` returns `Option` instead of
# unwrapping — the validator is skipped on the fallback import path, so a
# texture whose source index points past the image table must not panic.
gltf = { workspace = true, features = [
    "KHR_materials_pbrSpecularGlossiness",
    "allow_empty_texture",
    "extensions",
] }
# 0.26 pulls fs4 0.13 (rustix 0.38 -> 1.x), collapsing rustix/linux-raw-sys
# and itertools 0.12 onto the versions the rest of the graph already uses.
# Two API fixes were needed: `TopDocs::with_limit(..).order_by_score()` and
# `Document::get_first` returning `CompactDocValue` instead of `OwnedValue`.
tantivy = "0.26"
jieba-rs = "0.7"
# Deliberately on the 0.7 line: 0.8+ moves to phf 0.13, but the phf 0.11 it
# currently shares with gpui-base's html5ever -> markup5ever would not go away
# either (markup5ever pins it), so upgrading only adds phf_codegen 0.13 as a
# second copy. Revisit once html5ever moves to phf 0.13.
pinyin = "0.10"
# Offline license keys (see the note in the workspace manifest): signature
# verification and the Crockford Base32 codec for the pasted key text.
ed25519-dalek = { workspace = true }
data-encoding = { workspace = true }
# The ICC transform engine for the thumbnail's "fold into sRGB" step.
qcms = { workspace = true }
# The OpenEXR part decoder. `image`'s `exr` feature reads EXR but offers no
# part/layer selection (`first_valid_layer()` is hard-wired), and the part
# selector needs exactly that — so the crate is a dependency in its own
# right, not only a fixture writer. Already in the graph at this version
# (the `image/exr` feature pulls it in), so this costs no download and no
# second copy.
exr = "1"
# The local AI engines (BGE embeddings, Whisper transcription) run through
# candle — a pure-Rust tensor stack, so nothing here compiles or links C++.
# The GPU backends ride the features above: the default build is CPU and the
# release workflow turns CUDA on where a toolkit is installed.
candle-core = "0.11"
candle-nn = "0.11"
candle-transformers = "0.11"
# Whisper's own tokenizer (BPE), loaded from the model directory. The
# tokenizers crate is pure Rust.
tokenizers = "0.21"

[dev-dependencies]
# Same reasoning as `exr` above, and the same shape of problem: `image`'s GIF
# encoder can write a still but exposes no per-frame API, so a test that needs a
# real animated GIF with known delays has to write one with `gif` directly.
# Already in the graph at this version (`image`'s `gif` feature pulls it in), so
# this costs no download and no second copy.
gif = "0.13"

[target.'cfg(target_os = "linux")'.dependencies]
# KWin's own capture interface (org.kde.KWin.ScreenShot2): KDE implements
# neither wlr-screencopy nor ext-image-copy-capture, so this D-Bus call is
# the only in-process way to capture on Plasma. zbus already rides in the
# graph via gpui-pre -> ashpd/oo7, so no new compiled crates.
zbus = "5"
