[package]
name = "trove-core"
version = "0.4.0"
edition = "2024"
license = "MIT"

[dependencies]
chrono = { workspace = true }
dirs = { workspace = true }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "tiff", "ico"] }
kamadak-exif = "0.5"
lofty = "0.21"
mp4 = { workspace = true }
ttf-parser = { workspace = true }
fontdue = { workspace = true }
rusqlite = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
rayon = { workspace = true }
memchr = "2"  # already in the tree via regex; SIMD byte search for the ASCII splitter
memmap2 = "0.9"  # memory-mapped file access for large PLY files
regex = "1"
ureq = { workspace = true }
resvg = { workspace = true }
psd = { workspace = true }
rawler = { workspace = true }
jxl-oxide = { workspace = true }
