[package]
name = "trove-core"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
libsql = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
trove-plugin-api = { path = "../trove-plugin-api" }
uuid = { version = "1", features = ["v4", "serde"] }
