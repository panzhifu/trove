[package]
name = "trove-core"
version = "0.4.2"
edition = "2024"
license = "MIT"

[dependencies]
chrono = { workspace = true }
dirs = { workspace = true }
image = { workspace = true }
kamadak-exif = "0.5"
lofty = "0.21"
mp4 = { workspace = true }
ttf-parser = { workspace = true }
fontdue = { workspace = true }
rusqlite = { workspace = true }
# In-process screen capture for the screenshot import (macOS
# ScreenCaptureKit, Windows Graphics Capture, Linux XCB). The external-tool
# chain in services/screenshot.rs stays as the last fallback, so a failed
# capture degrades instead of failing.
xcap = "0.9.8"

[target.'cfg(target_os = "linux")'.dependencies]
# Wayland in-process capture, primary on Linux. Pure-Rust grim that prefers
# ext-image-copy-capture-v1 — what niri implements; xcap's libwayshot
# backend only speaks wlr-screencopy, which niri rejects — and falls back
# to wlr-screencopy for wlroots compositors. Its whole stack (wayland-client
# 0.31, image, chrono, …) is already in the graph via gpui, so this adds no
# compiled crates here.
grim-rs = "0.2"
# Probe layer: the `screenshots` crate's Wayland path is the
# xdg-desktop-portal Screenshot D-Bus interface rather than a capture
# protocol, so this tells us whether the user session has a working
# Screenshot portal backend. Deprecated upstream (moved to xcap) and drags
# in image 0.24 + dbus — remove once the portal question is answered.
screenshots = "0.8"
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
rayon = { workspace = true }
memchr = "2"
memmap2 = "0.9"  # memory-mapped file access for large PLY files
ureq = { workspace = true }
resvg = { workspace = true }
psd = { workspace = true }
rawler = { workspace = true }
jxl-oxide = { workspace = true }
gltf = { workspace = true }
# 0.26 pulls fs4 0.13 (rustix 0.38 -> 1.x), collapsing rustix/linux-raw-sys
# and itertools 0.12 onto the versions the rest of the graph already uses.
# Two API fixes were needed: `TopDocs::with_limit(..).order_by_score()` and
# `Document::get_first` returning `CompactDocValue` instead of `OwnedValue`.
tantivy = "0.26"
jieba-rs = "0.7"
# Deliberately on the 0.7 line: 0.8+ moves to phf 0.13, but the phf 0.11 it
# currently shares with gpui-base's html5ever -> markup5ever would not go away
# either (markup5ever pins it), so upgrading only adds phf_codegen 0.13 as a
# second copy. Revisit once html5ever moves to phf 0.13.
pinyin = "0.10"
