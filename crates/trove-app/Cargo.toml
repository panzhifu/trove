[package]
name = "trove-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
gpui-kit = { workspace = true }
wgpu = { workspace = true }
trove-core = { path = "../trove-core" }
dirs = { workspace = true }
image = { workspace = true }
arboard = { workspace = true }
smallvec = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
rust-i18n = { workspace = true }
# The license module's dates: build date, update-coverage end. Already
# compiled in the graph via trove-core; this adds no crates.
chrono = { workspace = true }
# Parses plugins' own language files at startup. toml 0.8 already rides in
# the graph via rust-i18n's loader, so this adds no compiled crates.
toml = "0.8"
sys-locale = { workspace = true }
tracing = { workspace = true }
rodio = { workspace = true }
# System tray, one API for all three platforms. The default features must stay
# off: they pull in GTK, libappindicator and libxdo, none of which the tray
# needs on Linux — `ksni` is a pure D-Bus StatusNotifierItem (which is also
# what KDE Plasma speaks natively), and it reuses the zbus already in the
# tree through gpui. The feature is target-gated inside the crate, so it is
# inert on macOS and Windows.
tray-icon = { version = "0.25", default-features = false, features = ["ksni"] }

# ALSA's raw bindings, already compiled in the graph via cpal. Linux only:
# the audio output replaces ALSA's chatty default error handler with a
# silent one, because the device scan *expects* half the probed PCMs to
# fail to open (jack, oss, dmix) and ALSA prints a line for each.
[target.'cfg(target_os = "linux")'.dependencies]
alsa-sys = "0.3"
# dup/dup2 for the same scan: libjack's "no server" lines are plain
# fprintfs inside the client library, past every error handler ALSA can
# offer, so the enumeration mutes fd 2 itself. Already in the graph via
# alsa-sys; this adds no compiled crates.
libc = "0.2"

[dev-dependencies]
# Used only to parse and validate `gpu3d.wgsl` on machines without a GPU.
naga = { version = "29", features = ["wgsl-in"] }
# Used only to write an animated GIF for the preview player's test: `image`'s
# GIF encoder has no per-frame API, so the crate that reads an animated GIF
# cannot produce one. Already in the graph at this version via `image`.
gif = "0.13"
# Signs a throwaway key for the license-activation refusal test: the test
# proves a foreign signature is rejected before anything is stored.
ed25519-dalek = { workspace = true }
