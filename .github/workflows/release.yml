name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  APP_NAME: trove

jobs:
  build:
    name: Build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS (Apple Silicon)
          - target: aarch64-apple-darwin
            os: macos-14
            asset_name: trove-aarch64-apple-darwin
            archive_ext: zip
          # macOS (Intel)
          - target: x86_64-apple-darwin
            os: macos-14
            asset_name: trove-x86_64-apple-darwin
            archive_ext: zip
          # Linux (x86_64). Built on the oldest LTS runner image so the
          # artifact's glibc floor stays low (22.04 -> glibc 2.35). Note:
          # GitHub began deprecating the ubuntu-22.04 image in September 2026
          # and drops it entirely by April 2027 — when that happens, either
          # build inside an ubuntu:22.04 container or accept the newer floor.
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
            asset_name: trove-x86_64-unknown-linux-gnu
            archive_ext: tar.gz
          # Windows (x86_64)
          - target: x86_64-pc-windows-msvc
            os: windows-2022
            asset_name: trove-x86_64-pc-windows-msvc
            archive_ext: zip

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ matrix.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ matrix.os }}-${{ matrix.target }}-cargo-

      - name: Install system dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # Every system library this graph needs, mapped to the crate that
          # needs it — the list must not depend on what the image happens to
          # preinstall, because images differ (24.04 dropped fontconfig and
          # libgbm, and each of those killed a run on its own):
          #   libxcb1-dev         xcb (gpui clipboard/capture)
          #   libxkbcommon*-dev   xkbcommon (gpui keyboard)
          #   libegl1-mesa-dev    khronos-egl (gpui/wgpu GL context)
          #   libfontconfig1-dev  yeslogic-fontconfig-sys <- zed-font-kit
          #   libasound2-dev      alsa-sys <- cpal (rodio, video preview audio)
          #   libwayland-dev      wayland-sys (client/cursor/egl/server)
          #   libdrm-dev          drm-sys <- gbm
          #   libzstd-dev         zstd-sys <- tantivy
          # and the link-only one, which consults no .pc file:
          #   libgbm-dev          gbm (rustc-link-lib=gbm, gpui's GBM surface)
          # No pipewire: xcap is not a Linux dependency any more (see
          # trove-core's Cargo.toml), so nothing in the graph binds it.
          # libfontconfig1-dev is the name that exists on both jammy and
          # noble (on noble it forwards to libfontconfig-dev).
          sudo apt-get install -y \
            libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libegl1-mesa-dev libgl1-mesa-dev libfontconfig1-dev \
            libasound2-dev libwayland-dev libdrm-dev libzstd-dev \
            libgbm-dev

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }} -p trove-app

      - name: Package (zip)
        if: matrix.archive_ext == 'zip'
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release
          if [[ "${{ matrix.target }}" == *windows* ]]; then
            7z a ../../../${{ matrix.asset_name }}.zip trove-app.exe
          else
            zip -r ../../../${{ matrix.asset_name }}.zip trove-app
          fi
          cd -

      - name: Package (tar.gz)
        if: matrix.archive_ext == 'tar.gz'
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../${{ matrix.asset_name }}.tar.gz trove-app
          cd -

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: ${{ matrix.asset_name }}.${{ matrix.archive_ext }}
          retention-days: 1

  release:
    name: Create Release & Upload Assets
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: false

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Trove ${{ github.ref_name }}"
          draft: false
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
          files: artifacts/**/*.{zip,tar.gz}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
