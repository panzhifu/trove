name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  APP_NAME: trove

jobs:
  build:
    name: Build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS (Apple Silicon)
          - target: aarch64-apple-darwin
            os: macos-14
            asset_name: trove-aarch64-apple-darwin
            archive_ext: zip
          # macOS (Intel)
          - target: x86_64-apple-darwin
            os: macos-14
            asset_name: trove-x86_64-apple-darwin
            archive_ext: zip
          # Linux (x86_64). Built on 24.04, not 22.04: xcap -> libspa needs
          # pipewire headers >= 0.3.65 (see the Ubuntu step below), and jammy's
          # 0.3.48 cannot compile the crate. Consequence: this artifact needs
          # glibc >= 2.39, i.e. Ubuntu 24.04+ / Debian 13+ at runtime.
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
            asset_name: trove-x86_64-unknown-linux-gnu
            archive_ext: tar.gz
          # Windows (x86_64)
          - target: x86_64-pc-windows-msvc
            os: windows-2022
            asset_name: trove-x86_64-pc-windows-msvc
            archive_ext: zip

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ matrix.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ matrix.os }}-${{ matrix.target }}-cargo-

      - name: Install system dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # libpipewire-0.3-dev: xcap (the in-process screenshot import) pulls
          # pipewire/libspa on Linux, and libspa binds the system headers at
          # build time. That needs pipewire >= 0.3.65 for spa_video_info_raw.flags,
          # spa_meta_first and spa_meta_region_is_valid — jammy's 0.3.48 has none
          # of them, so this job is on ubuntu-24.04 (pipewire 1.0.5) and cannot
          # move back to 22.04.
          sudo apt-get install -y \
            libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libegl1-mesa-dev libgl1-mesa-dev libpipewire-0.3-dev

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }} -p trove-app

      - name: Package (zip)
        if: matrix.archive_ext == 'zip'
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release
          if [[ "${{ matrix.target }}" == *windows* ]]; then
            7z a ../../../${{ matrix.asset_name }}.zip trove-app.exe
          else
            zip -r ../../../${{ matrix.asset_name }}.zip trove-app
          fi
          cd -

      - name: Package (tar.gz)
        if: matrix.archive_ext == 'tar.gz'
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../${{ matrix.asset_name }}.tar.gz trove-app
          cd -

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: ${{ matrix.asset_name }}.${{ matrix.archive_ext }}
          retention-days: 1

  release:
    name: Create Release & Upload Assets
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: false

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Trove ${{ github.ref_name }}"
          draft: false
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
          files: artifacts/**/*.{zip,tar.gz}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
