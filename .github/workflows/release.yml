name: Release

on:
  push:
    tags:
      - "v*.*.*"
  # Dry run without a tag: derives the version from Cargo.toml and runs the
  # full packaging pipeline (no release is created — the release job is
  # tag-gated below).
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS (Apple Silicon). Apple does not do CUDA — the local AI
          # engines compile against candle's CPU backend, sped up by Apple's
          # Accelerate framework (a system framework, nothing to install).
          # The experimental `metal` backend is not enabled in releases.
          - target: aarch64-apple-darwin
            os: macos-14
            artifact: trove-aarch64-apple-darwin
            features: accelerate
          # macOS (Intel)
          - target: x86_64-apple-darwin
            os: macos-14
            artifact: trove-x86_64-apple-darwin
            features: accelerate
          # Linux (x86_64). Built on 24.04, not 22.04: xcap -> libspa needs
          # pipewire headers >= 0.3.65 (see the Ubuntu step below), and jammy's
          # 0.3.48 cannot compile the crate. Consequence: this artifact needs
          # glibc >= 2.39, i.e. Ubuntu 24.04+ / Debian 13+ at runtime — which
          # is exactly what the .deb declares and the .rpm requires.
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
            artifact: trove-x86_64-unknown-linux-gnu
            features: cuda
          # Windows (x86_64) — CUDA like Linux: the toolkit is installed
          # below and nvcc compiles the kernels at build time. The artifact
          # runs on machines without NVIDIA too (CPU fallback at runtime).
          - target: x86_64-pc-windows-msvc
            os: windows-2022
            artifact: trove-x86_64-pc-windows-msvc
            features: cuda

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # One version, one source: the workspace Cargo.toml. On a tag push it
      # must match the tag — the in-app updater (services/update.rs) compares
      # the tag against this number, so a mismatch ships a release that
      # nags every user forever. Artifact filenames carry the same version.
      - name: Derive version
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            ver=$(grep -m1 '^version = ' Cargo.toml | sed 's/.*"\(.*\)"/\1/')
            echo "VERSION=$ver" >> "$GITHUB_ENV"
          fi

      - name: Verify tag matches the workspace version
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          ws=$(grep -m1 '^version = ' Cargo.toml | sed 's/.*"\(.*\)"/\1/')
          if [[ "${GITHUB_REF_NAME#v}" != "$ws" ]]; then
            echo "::error::tag $GITHUB_REF_NAME does not match Cargo.toml version $ws — they must move together (the updater compares them)."
            exit 1
          fi

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ matrix.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ matrix.os }}-${{ matrix.target }}-cargo-

      - name: Install system dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # Ubuntu 24.04 is required, not 22.04: xcap -> libspa binds the pipewire
          # headers at build time and needs >= 0.3.65 (spa_video_info_raw.flags,
          # spa_meta_first, spa_meta_region_is_valid); jammy's 0.3.48 fails.
          #
          # Every system library this graph needs, mapped to the crate that
          # needs it — the list must not depend on what the image happens to
          # preinstall, because ubuntu-24.04 dropped fontconfig and libgbm, and
          # each of those killed a run on its own:
          #   libxcb1-dev         xcb (gpui clipboard/capture)
          #   libxkbcommon*-dev   xkbcommon (gpui keyboard)
          #   libegl1-mesa-dev    khronos-egl (gpui/wgpu GL context)
          #   libfontconfig-dev   yeslogic-fontconfig-sys <- zed-font-kit
          #   libasound2-dev      alsa-sys <- cpal (rodio, video preview audio)
          #   libwayland-dev      wayland-sys (client/cursor/egl/server)
          #   libdrm-dev          drm-sys <- gbm
          #   libzstd-dev         zstd-sys <- tantivy
          #   libpipewire-0.3-dev libspa-sys <- pipewire <- xcap
          # and the link-only one, which consults no .pc file:
          #   libgbm-dev          gbm (rustc-link-lib=gbm, gpui's GBM surface)
          # plus the build-time one the Linux candle dependencies need:
          #   nvidia-cuda-toolkit nvcc <- cudarc's build script (candle's CUDA
          #     kernels compile at build time; the runner image does NOT ship
          #     it — see trove-core/Cargo.toml)
          sudo apt-get install -y \
            libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libegl1-mesa-dev libgl1-mesa-dev libfontconfig-dev \
            libasound2-dev libwayland-dev libdrm-dev libzstd-dev \
            libgbm-dev libpipewire-0.3-dev \
            nvidia-cuda-toolkit

      # The Windows CUDA build needs nvcc, which needs cl.exe on PATH: the
      # toolkit download below only installs it, this action wires the MSVC
      # environment the kernels' host-side compile runs through.
      - name: Set up MSVC environment (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install CUDA toolkit (Windows)
        if: runner.os == 'Windows'
        uses: Jimver/cuda-toolkit@v0.2.21
        with:
          cuda-toolkit-version: "12.6.3"
          method: network
          use-local-cache: false

      # Both binaries: the GUI (trove-app) and the CLI (trove) — every package
      # and archive below ships both; they share one library on disk.
      #
      # Each leg carries the GPU backend its platform supports (the matrix's
      # `features`): CUDA on Linux/Windows, whose kernels compile with nvcc
      # from the toolkit installed above; Apple's Accelerate framework on
      # macOS. At runtime the device is picked per machine — CUDA when a
      # working driver answers, CPU otherwise — so a CUDA-built artifact also
      # runs on machines without NVIDIA.
      #
      # CUDA_COMPUTE_CAP pins the kernels' target: the build script normally
      # auto-detects the installed GPU through nvidia-smi, which no CI runner
      # has. 80 (Ampere) is the floor the kernels compile at with current
      # CUDA toolchains (the compatibility shim breaks on sm_75), and PTX is
      # forward-compatible — the user's driver JIT-compiles it for whatever
      # GPU they actually own, so every Ampere-or-newer NVIDIA runs the same
      # artifact; pre-Ampere cards fall back to CPU at runtime.
      - name: Build release binaries
        shell: bash
        env:
          CUDA_COMPUTE_CAP: 80
        run: |
          cargo build --release --target ${{ matrix.target }} \
            --features ${{ matrix.features }} \
            -p trove-app -p trove-cli

      # ---------------------------------------------------------------- macOS
      - name: Package (zip)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release
          zip -r ../../../trove-${{ env.VERSION }}-${{ matrix.target }}.zip trove-app trove

      - name: Package (dmg)
        if: runner.os == 'macOS'
        shell: bash
        run: packaging/macos/make-bundle.sh "$VERSION" "target/${{ matrix.target }}/release"

      # ---------------------------------------------------------------- Linux
      - name: Package (tar.gz)
        if: runner.os == 'Linux'
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../trove-${{ env.VERSION }}-${{ matrix.target }}.tar.gz trove-app trove

      - name: Package (deb)
        if: runner.os == 'Linux'
        run: packaging/linux/build-deb.sh "$VERSION" "target/${{ matrix.target }}/release"

      - name: Package (rpm)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y rpm
          packaging/linux/build-rpm.sh "$VERSION" "target/${{ matrix.target }}/release"

      # -------------------------------------------------------------- Windows
      - name: Package (zip)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release
          7z a ../../../trove-${{ env.VERSION }}-${{ matrix.target }}.zip trove-app.exe trove.exe

      - name: Package (installer)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          choco install innosetup -y
          # Simplified Chinese is not among the languages the compiler
          # bundles. Download it from the upstream repo, pinned to a commit
          # so the URL cannot rot; a failed download degrades the wizard to
          # English instead of failing the release — the .iss references the
          # file only when it exists.
          curl -fsSL --retry 3 \
            "https://raw.githubusercontent.com/jrsoftware/issrc/7e5c6b38693caac3d921da632763c5038625ccd9/Files/Languages/ChineseSimplified.isl" \
            -o packaging/windows/ChineseSimplified.isl \
            || echo "::warning::ChineseSimplified.isl unavailable - building an English-only installer"
          # Single slashes + MSYS2_ARG_CONV_EXCL: ISCC wants /D and /O, and
          # the runner's bash rewrites a leading slash into a Git-install
          # path unless argument conversion is off — the doubled-slash trick
          # gets ISCC "Unknown option: //DBindir=…" instead.
          MSYS2_ARG_CONV_EXCL="*" "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" \
            /DAppVersion="$VERSION" \
            /DBindir="$(cygpath -m "$PWD/target/${{ matrix.target }}/release")" \
            /O. packaging/windows/trove.iss

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            trove-${{ env.VERSION }}-*.zip
            trove-${{ env.VERSION }}-*.tar.gz
            trove_${{ env.VERSION }}_*.deb
            trove-${{ env.VERSION }}-1.*.rpm
            Trove-${{ env.VERSION }}-*.dmg
            Trove-${{ env.VERSION }}-Setup.exe
          if-no-files-found: error
          retention-days: 1

  release:
    name: Create Release & Upload Assets
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: false

      # Two manifests for the whole release, published beside the artifacts.
      # BLAKE3SUMS is the one the in-app updater verifies a staged download
      # against (trove-core/src/services/update.rs) — the same hash primitive
      # the library itself uses. SHA256SUMS rides along for external tools
      # (`sha256sum -c`) that have no b3sum. Both are `<digest>  <basename>`
      # coreutils shape — the per-artifact subdirectory download-artifact
      # creates is stripped, so the names match what the release page shows.
      - name: Install b3sum
        uses: dtolnay/rust-toolchain@stable

      - name: Generate BLAKE3SUMS and SHA256SUMS
        shell: bash
        run: |
          cargo install b3sum
          cd artifacts
          for tool in b3sum sha256sum; do
            # The b3sum manifest must land as BLAKE3SUMS — the exact name the
            # in-app updater fetches (trove-core/src/services/update.rs). The
            # `${tool^^}S` spelling mangles b3sum into B3SUMS, which nothing
            # reads.
            case "$tool" in
              b3sum) manifest=BLAKE3SUMS ;;
              *) manifest="${tool^^}S" ;;
            esac
            find . -type f \( -name '*.zip' -o -name '*.tar.gz' -o -name '*.deb' \
              -o -name '*.rpm' -o -name '*.exe' -o -name '*.dmg' \) -print0 \
              | sort -z \
              | xargs -0 "$tool" \
              | sed "s#^\([0-9a-f]\{64\}\)  \./[^/]*/#\1  #" \
              | sort -k2 \
              > "$manifest"
            cat "$manifest"
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Trove ${{ github.ref_name }}"
          draft: false
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
          files: |
            artifacts/**/*.{zip,tar.gz,deb,rpm,exe,dmg}
            artifacts/BLAKE3SUMS
            artifacts/SHA256SUMS
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
