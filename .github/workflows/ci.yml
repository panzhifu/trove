name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ matrix.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ matrix.os }}-cargo-

      - name: Install system dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # libpipewire-0.3-dev: xcap (the in-process screenshot import) pulls
          # pipewire/libspa on Linux, and libspa binds the system headers at
          # build time. That needs pipewire >= 0.3.65 for spa_video_info_raw.flags,
          # spa_meta_first and spa_meta_region_is_valid — jammy's 0.3.48 has none
          # of them, so this job is on ubuntu-24.04 (pipewire 1.0.5) and cannot
          # move back to 22.04.
          sudo apt-get install -y \
            libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libegl1-mesa-dev libgl1-mesa-dev libpipewire-0.3-dev

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build
        run: cargo build --workspace --verbose

      - name: Test
        run: |
          set -o pipefail
          cargo test --workspace --verbose 2>&1 | tee test-output.txt
        shell: bash

      - name: Emit test failures as annotations
        if: failure()
        run: |
          grep -E "panicked at|test result: FAILED|^failures:" test-output.txt | tr -d '\r' | cut -c1-380 | while IFS= read -r line; do
            echo "::error::$line"
          done
        shell: bash
