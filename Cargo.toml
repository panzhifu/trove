[workspace]
members = ["crates/trove-cli", "crates/trove-core", "crates/trove-app"]
resolver = "3"

[profile.release]
strip = true
lto = "thin"

[workspace.dependencies]
# UI
#
# Tracks upstream `main` rather than a crates.io release: the dock/window
# changes this project builds against are not in any published version, and
# following the tip keeps new upstream work one `cargo update` away. Its
# `gpui-*` and `gpui-kit-assets` members are path dependencies inside that
# checkout, so the whole tree moves as one; the `gpui-pre-*` platform crates
# come from crates.io at the version upstream asks for (they used to be
# overridden with `path = "../gpui-kit/crates/gpui-pre-*"`, which only exists
# on a workstation with a sibling gpui-kit checkout — never on a CI runner,
# where cargo could not even load the manifest and every macOS/Windows target
# build died before it started).
#
# Riding a branch tip means an upstream commit can break this build; if that
# happens, pin `rev = "<sha>"` here.
gpui-kit = { git = "https://github.com/longbridge/gpui-kit.git", branch = "main" }

# GPU rendering for the 3D model viewport. Kept in step with the wgpu that
# gpui itself builds against, so the graph has one version and one backend set.
wgpu = "29"

rayon = "1"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Persistence
rusqlite = { version = "0.37", features = ["bundled", "chrono", "uuid", "serde_json"] }

# Hashing: one primitive for the whole crate — content hashes (dedup key, blob
# name, thumbnail cache key, integrity check) and the AI embedding fingerprint
# alike, see `trove-core/src/media/hash.rs`. BLAKE3 over SHA-256 for the two
# reasons that matter to an importer: several times faster per byte single
# threaded, and a tree, so one large file can be hashed across the rayon pool
# the caller is already on. The `rayon` feature is what buys that path; it
# rides in the graph via the workspace's own rayon, adding no new crate.
#
# `sha2` is no longer declared: nothing of ours uses it. Two versions still
# ride in the graph (`oo7` via `gpui-pre` pins 0.10, `gpui-kit-assets` asks
# for 0.11) — that is upstream's business, not a pin of ours to maintain.
blake3 = { version = "1", features = ["rayon"] }

# CLI parsing for the headless `trove` binary (`crates/trove-cli`). Declared
# here like every other dependency so the workspace keeps one copy; `derive`
# is what turns the command tree into the `--help` page that scripts and
# agents read to learn the surface.
clap = { version = "4", features = ["derive"] }

# Utilities
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
dirs = "5"

# Logging. `tracing` is the facade in both crates; `trove-app` installs the
# single global subscriber (stderr + a file under the config dir, filtered
# by RUST_LOG). tracing-subscriber already rides in the graph via gpui-pre
# (ashpd/zbus); declaring it here only turns on the `env-filter`/`registry`
# features the subscriber needs (they add the small `matchers` crate).
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "registry"] }

# Media probing
ttf-parser = "0.25"
fontdue = "0.9"
mp4 = "0.14"
# Image decoding. `trove-core` converts/reads every supported format and
# `trove-app` decodes APNG frames, so the feature set lives here once instead
# of being declared twice with a subset (features are unioned across the
# workspace anyway, a second declaration only invites drift).
image = { version = "0.25", default-features = false, features = [
    "png",
    "jpeg",
    "gif",
    "webp",
    "bmp",
    "tiff",
    "ico",
] }
smallvec = "1"

# Audio playback for the video preview (PCM out of the ffmpeg pipe).
# `default-features = false` drops the symphonia/claxon decoders: every
# media format is already handled by the ffmpeg subprocess, so the crate
# only has to carry the cpal output path.
rodio = { version = "0.19", default-features = false }

# Local collect service: URL fetching for the inbox (extension / curl)
ureq = "3"

# Data-URI encoding for the multimodal chat endpoint: a thumbnail handed to a
# vision model travels as `data:image/jpeg;base64,…` in the request body.
# Already in the lock file as a transitive dependency, so declaring it here
# costs no new download.
base64 = "0.22"

# Folder watching: kernel events (inotify/FSEvents/ReadDirectoryChangesW) for
# the watch roots. The periodic sweep stays as the fallback — network mounts
# and fuse have no events to give, and an overflowed kernel queue drops them.
notify = "7"

# Design-format thumbnails (SVG render, PSD composite, RAW decode).
# Pinned to the 0.46 line so the graph keeps a single resvg/usvg: gpui-pre
# (through gpui-kit) requires `resvg ^0.46`, and 0.45/0.46 are semver-
# incompatible under the 0.x rules.
resvg = "0.46"
psd = "0.3"
rawler = "0.8"

# JPEG-XL decode. Pinned to the version rawler already pulls in so the graph
# keeps a single copy; the `image` feature hands us an `image::ImageDecoder`.
jxl-oxide = { version = "0.12", features = ["image"] }

# glTF 2.0 loader, used directly by `formats/gltf.rs`.
gltf = "1.4"

# i18n
rust-i18n = "4.2"
sys-locale = "0.3"

# Clipboard: image copy. `wayland-data-control` is opt-in upstream and takes
# priority over the X11 backend when the compositor speaks the protocol.
arboard = { version = "3", features = ["wayland-data-control"] }

# No `[patch.crates-io]` section on purpose: `gpui-kit` is declared as a git
# dependency above, and everything else it drags in is either a path member of
# that checkout or a crates.io crate at the version upstream asks for.
