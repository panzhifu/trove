[workspace]
members = ["crates/trove-core", "crates/trove-app"]
resolver = "3"

[profile.release]
strip = true
lto = "thin"

[workspace.dependencies]
# UI
gpui-kit = "0.6"

# GPU rendering for the 3D model viewport. Kept in step with the wgpu that
# gpui itself builds against, so the graph has one version and one backend set.
wgpu = "29"

# ML inference (CLIP semantic search)
ort = { version = "2.0.0-rc.13", default-features = false, features = ["load-dynamic", "ndarray", "std", "api-27"] }
ndarray = "0.17"
rayon = "1"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Persistence
rusqlite = { version = "0.37", features = ["bundled", "chrono", "uuid", "serde_json"] }
sha2 = "0.10"

# Utilities
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
dirs = "5"

# Media probing
ttf-parser = "0.25"
fontdue = "0.9"
mp4 = "0.14"
image = { version = "0.25", default-features = false, features = ["png"] }
smallvec = "1"

# Local collect service: URL fetching for the inbox (extension / curl)
ureq = "3"

# Design-format thumbnails (SVG render, PSD composite, RAW decode)
resvg = "0.45"
psd = "0.3"
rawler = "0.8"

# JPEG-XL decode. Pinned to the version rawler already pulls in so the graph
# keeps a single copy; the `image` feature hands us an `image::ImageDecoder`.
jxl-oxide = { version = "0.12", features = ["image"] }

# i18n
rust-i18n = "4.2"
sys-locale = "0.3"

# Clipboard: image copy. `wayland-data-control` is opt-in upstream and takes
# priority over the X11 backend when the compositor speaks the protocol.
arboard = { version = "3", features = ["wayland-data-control"] }

[patch.crates-io]
gpui-kit = { git = "https://github.com/panzhifu/gpui-kit.git", branch = "feat/optional-ellipsis-menu" }
gpui-kit-assets = { git = "https://github.com/panzhifu/gpui-kit.git", branch = "feat/optional-ellipsis-menu" }
