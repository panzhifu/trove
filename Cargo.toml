[workspace]
members = ["crates/trove-core", "crates/trove-app"]
resolver = "3"

[workspace.dependencies]
# UI
gpui-kit = "0.6"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Persistence
libsql = { version = "0.6", default-features = false, features = ["core"] }
sha2 = "0.10"

# Utilities
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
dirs = "5"

# Media probing
ttf-parser = "0.25"
mp4 = "0.14"

# i18n
rust-i18n = "4.2"
sys-locale = "0.3"

[patch.crates-io]
gpui-kit = { git = "https://github.com/panzhifu/gpui-kit.git", branch = "feat/optional-ellipsis-menu" }
gpui-kit-assets = { git = "https://github.com/panzhifu/gpui-kit.git", branch = "feat/optional-ellipsis-menu" }
# Windows: fix libsql-sys using std::os::unix on Windows (tursodatabase/libsql#1763)
libsql-sys = { git = "https://github.com/tursodatabase/libsql.git", branch = "main" }
